    <!-- summary_large_image memberi kartu lebar penuh. Tanpa ini X/Twitter
         memakai thumbnail kecil dan seluruh kartunya terpotong jadi kotak. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://dvdadriel.web.id/og-image.jpg?v=2" />
    <!-- Harus cocok dengan --color-surface di index.css. Kalau tidak, chrome
         browser di ponsel memakai warna yang tidak ada di halaman — dan itu
         justru paling terlihat di HP, tempat mayoritas orang membuka ini.
         Putih adalah warna kanvas; blok navy dan hitam datang setelah hero. -->
    <meta name="theme-color" content="#FFFFFF" />

    <!-- Sebelumnya tidak ada favicon sama sekali, jadi browser jatuh ke
         /favicon.ico yang tidak pernah ada. Diamond-nya sama dengan logo navbar. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Font di-host sendiri di /fonts (Nunito display + Sora teks), jadi
         tidak ada preconnect ke pihak ketiga: satu domain lebih sedikit yang
         harus hidup agar halaman ini terbaca benar.

         Dua file, satu per keluarga: keduanya variable, jadi seluruh rentang
         weight yang dipakai halaman ini datang dari file yang sama.

         Nunito di-preload meski hanya dipakai judul, dan itu disengaja:
         SplitText di Hero menunggu document.fonts.ready sebelum memecah
         huruf, jadi font ini berada tepat di jalur kritis animasi pembuka. -->
    <link rel="preload" href="/fonts/nunito.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/sora.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Halaman ini React client-side, jadi tanpa JavaScript #root tetap kosong.
      Daripada berpura-pura sebaliknya, noscript di bawah memuat informasi
      esensialnya sebagai HTML biasa: siapa, apa, di mana kodenya, cara
      menghubungi. Cukup untuk pengunjung tanpa JS dan crawler sederhana.
    -->
    <noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
